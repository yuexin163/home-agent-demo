server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yipin-ai.cn www.yipin-ai.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yipin-smart-home;
        try_files $uri =404;
    }

    location / {
        return 301 https://yipin-ai.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yipin-ai.cn;

    ssl_certificate /etc/letsencrypt/live/yipin-ai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yipin-ai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://yipin-ai.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yipin-ai.cn;

    ssl_certificate /etc/letsencrypt/live/yipin-ai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yipin-ai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/yipin-smart-home;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location = /api/asr/sign {
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:3100/api/asr/sign;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header Server;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
